[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools>=61.2" ]

[project]
name = "openai-whisper"
description = "Robust Speech Recognition via Large-Scale Weak Supervision"
readme.content-type = "text/markdown"
readme.file = "README.md"
license = { text = "MIT" }
authors = [ { name = "OpenAI" } ]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]
dependencies = [
  "more-itertools",
  "numba",
  "numpy",
  "tiktoken",
  "torch",
  "tqdm",
  "triton>=2; (platform_machine=='x86_64' and sys_platform=='linux') or sys_platform=='linux2'",
  "asyncpg>=0.32.0",
  "fastapi>=0.165.0",
  "faster-whisper>=1.2.1",
  "jinja2>=3.1.6",
  "numpy>=2.5.5",
  "openai>=3.55.1",
  "pydantic-settings>=2.16.3",
  "sqlalchemy[asyncio]>=2.1.9",
  "uvicorn[standard]>=0.54.0",
  "alembic>=1.13",
  "aiomcache>=0.8.2",
]
optional-dependencies.dev = [
 "black",
 "flake8",
 "httpx>=0.28.1",
 "isort",
 "pytest",
 "pytest-asyncio>=1.5.0",
 "scipy",
]
urls = { Homepage = "https://github.com/openai/whisper" }
scripts.whisper = "whisper.transcribe:cli"

[tool.setuptools]
py-modules = [ "whisper" ]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "whisper.version.__version__" }

[tool.setuptools.packages.find]
exclude = [ "tests*" ]
namespaces = false

[tool.black]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.isort]
profile = "black"
include_trailing_comma = true
line_length = 88
multi_line_output = 3
